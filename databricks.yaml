# Databricks Asset Bundle for databricks-contracts library
# See: https://docs.databricks.com/dev-tools/bundles/index.html
#
# Deploy commands:
#   databricks bundle validate -t dev
#   databricks bundle deploy -t dev
#   databricks bundle deploy -t prod

bundle:
  name: databricks_contracts

# =============================================================================
# Artifacts - Build and deploy the wheel automatically
# =============================================================================
# Reference: https://docs.databricks.com/aws/en/dev-tools/bundles/artifact-private#reference-the-artifact

artifacts:
  databricks_contracts:
    type: whl
    path: .
    build: |
      pip install build setuptools-scm
      python -m build --wheel

# =============================================================================
# Variables
# =============================================================================

variables:
  # Unity Catalog Volume for storing wheels (for clients to consume)
  wheels_volume_path:
    description: "UC Volume path where wheels are published for clients"
    default: "/Volumes/shared/lib/wheels"

  # Service Principal for run_as (optional)
  sp_client_id:
    description: "Service Principal Client ID for run_as"
    default: ""

# =============================================================================
# Targets (environments)
# =============================================================================

targets:
  # ---------------------------------------------------------------------------
  # Development - root_path must be per-user (~/ or contain username) when mode: development
  # ---------------------------------------------------------------------------
  dev:
    mode: production
    default: true
    workspace:
      root_path: /Workspace/Shared/.bundle/databricks_contracts/dev
    permissions:
      - group_name: "users"
        level: CAN_MANAGE
    variables:
      wheels_volume_path: "/Volumes/shared/lib/wheels"

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/databricks_contracts/prod
    permissions:
      - group_name: "users"
        level: CAN_MANAGE
    variables:
      wheels_volume_path: "/Volumes/shared/lib/wheels"
    run_as:
      service_principal_name: ${var.sp_client_id}
